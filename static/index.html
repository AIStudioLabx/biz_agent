<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话 - biz_agent</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f8fafc; }
        .header { padding: 0.75rem 1rem; background: #1e293b; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
        .header-actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.35rem 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; }
        .btn-ghost { background: transparent; color: #94a3b8; }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .app { display: flex; flex: 1; min-height: 0; }
        .sidebar { width: 240px; flex-shrink: 0; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0.75rem; border-bottom: 1px solid #e2e8f0; gap: 0.5rem; }
        .sidebar-title { font-size: 0.75rem; font-weight: 600; color: #64748b; margin: 0; }
        .btn-sidebar { padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 6px; border: 1px solid #e2e8f0; background: #fff; color: #475569; cursor: pointer; }
        .btn-sidebar:hover { background: #f1f5f9; color: #1e293b; }
        .session-list { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
        .session-item { display: block; width: 100%; padding: 0.5rem 0.75rem; text-align: left; border: none; background: transparent; cursor: pointer; font-size: 0.875rem; color: #334155; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-item:hover { background: #f1f5f9; }
        .session-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 500; }
        .session-item.empty-summary { color: #94a3b8; font-style: italic; }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; max-width: 720px; width: 100%; margin: 0 auto; }
        .msg { max-width: 85%; padding: 0.6rem 0.9rem; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg .msg-content { white-space: pre-wrap; }
        .msg-user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
        .msg-assistant { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
        .msg-role { font-size: 0.7rem; color: #64748b; margin-bottom: 0.2rem; }
        .msg-user .msg-role { color: #93c5fd; }
        .input-area { padding: 1rem; background: #fff; border-top: 1px solid #e2e8f0; }
        .input-wrap { max-width: 720px; margin: 0 auto; display: flex; gap: 0.5rem; align-items: flex-end; }
        textarea { flex: 1; min-height: 44px; max-height: 160px; padding: 0.6rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 10px; resize: none; font: inherit; }
        textarea:focus { outline: none; border-color: #2563eb; }
        .send-btn { padding: 0.6rem 1rem; background: #2563eb; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 500; }
        .send-btn:hover { background: #1d4ed8; }
        .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #error { max-width: 720px; margin: 0 auto; padding: 0.25rem 0; color: #dc2626; font-size: 0.875rem; }
        .empty { color: #94a3b8; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header class="header">
        <h1>业务问题修复助手</h1>
        <div class="header-actions">
            <a class="btn btn-ghost" href="/ddl" style="text-decoration: none;">上传 DDL</a>
            <button type="button" class="btn btn-ghost" id="newChat">新对话</button>
        </div>
    </header>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">会话</span>
                <button type="button" class="btn-sidebar" id="newSession">新会话</button>
            </div>
            <div class="session-list" id="sessionList"></div>
        </aside>
        <main class="main">
            <div class="messages" id="messages">
                <div class="empty" id="empty">发送一条消息开始对话，对话将保存在当前会话中。</div>
            </div>
            <div id="error"></div>
            <div class="input-area">
                <div class="input-wrap">
                    <textarea id="input" placeholder="输入消息…" rows="1"></textarea>
                    <button type="button" class="send-btn" id="send">发送</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const emptyEl = document.getElementById('empty');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const errorEl = document.getElementById('error');
        const newChatBtn = document.getElementById('newChat');
        const newSessionBtn = document.getElementById('newSession');
        const sessionListEl = document.getElementById('sessionList');

        let sessionId = null;

        function showEmpty(show) {
            emptyEl.style.display = show ? 'block' : 'none';
        }

        function appendMessage(role, content) {
            showEmpty(false);
            const div = document.createElement('div');
            div.className = 'msg msg-' + role;
            div.innerHTML = '<div class="msg-role">' + (role === 'user' ? '我' : '助手') + '</div>' + escapeHtml(content);
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        async function loadSessionMessages(id) {
            try {
                const res = await fetch('/v1/sessions/' + encodeURIComponent(id) + '/messages');
                if (!res.ok) return;
                const list = await res.json();
                showEmpty(list.length === 0);
                list.forEach(m => appendMessage(m.role, m.content));
            } catch (_) {}
        }

        async function loadSessions() {
            try {
                const res = await fetch('/v1/sessions');
                if (!res.ok) return;
                const list = await res.json();
                renderSessionList(list);
            } catch (_) {}
        }

        function renderSessionList(list) {
            sessionListEl.innerHTML = '';
            list.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'session-item' + (s.id === sessionId ? ' active' : '');
                if (!s.summary || s.summary.trim() === '') {
                    btn.classList.add('empty-summary');
                    btn.textContent = '新对话';
                } else {
                    btn.textContent = s.summary.trim();
                }
                btn.dataset.sessionId = s.id;
                btn.addEventListener('click', () => switchToSession(s.id));
                sessionListEl.appendChild(btn);
            });
        }

        function switchToSession(id) {
            sessionId = id;
            history.replaceState({}, '', '?session=' + encodeURIComponent(id));
            emptyEl.style.display = 'none';
            emptyEl.textContent = '发送一条消息开始对话，对话将保存在当前会话中。';
            while (messagesEl.lastElementChild && messagesEl.lastElementChild !== emptyEl)
                messagesEl.removeChild(messagesEl.lastElementChild);
            loadSessionMessages(id);
            loadSessions();
        }

        function initFromUrl() {
            const params = new URLSearchParams(location.search);
            const sid = params.get('session');
            if (sid) {
                sessionId = sid;
                loadSessionMessages(sid);
            }
        }

        function startNewSession() {
            sessionId = null;
            emptyEl.style.display = 'block';
            emptyEl.textContent = '发送一条消息开始新对话。';
            while (messagesEl.lastElementChild && messagesEl.lastElementChild !== emptyEl)
                messagesEl.removeChild(messagesEl.lastElementChild);
            history.replaceState({}, '', '/');
            loadSessions().then(() => {
                sessionListEl.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            });
        }

        newChatBtn.addEventListener('click', startNewSession);
        newSessionBtn.addEventListener('click', startNewSession);

        sendBtn.addEventListener('click', send);
        inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

        function appendAssistantStreaming() {
            showEmpty(false);
            const div = document.createElement('div');
            div.className = 'msg msg-assistant';
            div.innerHTML = '<div class="msg-role">助手</div><div class="msg-content"></div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div.querySelector('.msg-content');
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text) return;
            errorEl.textContent = '';
            appendMessage('user', text);
            inputEl.value = '';
            sendBtn.disabled = true;
            const contentEl = appendAssistantStreaming();
            try {
                const body = { message: text };
                if (sessionId) body.session_id = sessionId;
                const res = await fetch('/v1/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    errorEl.textContent = data.error || res.statusText;
                    contentEl.parentElement.remove();
                    return;
                }
                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let buf = '';
                let streamDone = false;
                while (!streamDone) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const parts = buf.split('\n\n');
                    buf = parts.pop() || '';
                    for (const block of parts) {
                        let event = '';
                        let data = '';
                        for (const line of block.split('\n')) {
                            if (line.startsWith('event: ')) event = line.slice(7).trim();
                            else if (line.startsWith('data: ')) data = line.slice(6);
                        }
                        if (event === 'done') {
                            try {
                                const obj = JSON.parse(data);
                                if (obj.session_id) {
                                    sessionId = obj.session_id;
                                    if (!location.search.includes('session='))
                                        history.replaceState({}, '', '?session=' + encodeURIComponent(sessionId));
                                    loadSessions();
                                }
                            } catch (_) {}
                            streamDone = true;
                            break;
                        }
                        if (event === 'error') {
                            try {
                                const obj = JSON.parse(data);
                                errorEl.textContent = obj.error || data;
                            } catch (_) {
                                errorEl.textContent = data;
                            }
                            streamDone = true;
                            break;
                        }
                        if (data !== undefined && data !== '') contentEl.textContent += data;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                }
            } catch (e) {
                errorEl.textContent = '请求失败: ' + e.message;
                contentEl.parentElement.remove();
            } finally {
                sendBtn.disabled = false;
            }
        }

        initFromUrl();
        loadSessions();
    </script>
</body>
</html>
